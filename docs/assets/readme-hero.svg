<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="hero-title hero-desc" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans CJK SC', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <title id="hero-title">OCS Plus：让模型协作，让答案可核对。</title>
  <desc id="hero-desc">深海军蓝背景的 OCS Plus 项目横幅。左侧介绍多模型协作、图文搜题和人工决策；右侧用流程图表示三个模型独立回答，汇聚至带加号的决策节点，再输出答案或进入待人工处理。</desc>

  <rect x="1" y="1" width="1278" height="398" rx="24" fill="#101725" stroke="#29364B" stroke-width="2"/>

  <text x="64" y="69" fill="#A6B6CF" font-size="13" font-weight="600" letter-spacing="2.8">OPEN SOURCE · COURSE ASSISTANT</text>
  <text x="60" y="158" fill="#F4F7FD" font-size="76" font-weight="800" letter-spacing="-2">OCS <tspan fill="#68E0CB">PLUS</tspan></text>
  <text x="64" y="217" fill="#E1E9F7" font-size="28" font-weight="500">让模型协作，让答案可核对。</text>

