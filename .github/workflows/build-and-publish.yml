name: Build and Publish OCS Plus

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '已审核的版本标签，如 v0.1.2 或 v0.1.2-beta.1；须与 package.json 一致'
        required: true
        type: string
      notes:
        description: '新建 Release 的更新说明；已有 Release 的正文会保留'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      BUILD_PATH: ../release
      VITE_BUILD_PATH: ../../release
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify release identity
        id: identity
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          node <<'NODE'
          const semver = require('semver');
          const version = semver.valid(process.env.RELEASE_TAG);
          const pkg = require('./package.json');
          const config = require('./packages/scripts/src/config/plus-repository.json');
          if (!version || version !== pkg.version) {
            throw new Error('发布标签须与 package.json 的版本一致');
          }
          if (config.repository !== process.env.GITHUB_REPOSITORY) {
            throw new Error('发布仓库与脚本更新源不一致');
          }
          require('fs').appendFileSync(process.env.GITHUB_OUTPUT,
            `prerelease=${!!semver.prerelease(version)}\n`);
          NODE
      # Build workspace package entry points before running integration regressions.
      - run: npm run build
      - run: npm test
      - name: Publish reviewed userscript
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ inputs.tag }}
          name: OCS Plus ${{ inputs.tag }}
          prerelease: ${{ steps.identity.outputs.prerelease == 'true' }}
          makeLatest: ${{ steps.identity.outputs.prerelease == 'true' && 'false' || 'true' }}
          artifacts: release/ocs.user.js,release/ocs.meta.js
          artifactErrorsFailBuild: true
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          body: |
            ${{ inputs.notes }}

            ---
            安装：[OCS Plus（支持任意 AI 接口域名）](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/ocs.user.js)

            [更新元信息](https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/ocs.meta.js)
